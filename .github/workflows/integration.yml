name: integration

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix: 
        node-version: [ 20.x, 22.x, 24.x ]
    
    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: setup Node.js environment
        uses: actions/checkout@v4
        with:
          node-version: ${{matrix.nodeversion}}
          cache: 'npm'
      
      - name: install dependencies
        run: npm install
      - name: build
        run: npm run build

  unit-test:
    runs-on: ubuntu-latest

    strategy:
      matrix: 
        node-version: [ 20.x, 22.x, 24.x ]
    
    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: setup Node.js environment
        uses: actions/checkout@v4
        with:
          node-version: ${{matrix.nodeversion}}
          cache: 'npm'
      
      - name: install dependencies
        run: npm ci
      - name: running test cases
        run: npm run test 