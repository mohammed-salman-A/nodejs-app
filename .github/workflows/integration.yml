name: integration

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: setup Node.js environment
        uses: actions/checkout@v4
        with:
          node-version: '20'
      
      - name: install dependencies
        run: npm install
      - name: build
        run: npm run build