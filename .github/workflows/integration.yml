  name: integration

  on: [push]

  jobs:
    unit-test:
      runs-on: ubuntu-latest

      strategy:
        matrix: 
          node-version: [ 20.x, 22.x, 24.x ]
      
      steps:
        - name: checkout code
          uses: actions/checkout@v4

        - name: setup Node.js environment
          uses: actions/checkout@v4
          with:
            node-version: ${{matrix.node-version}}
            cache: 'npm'
        
        - name: install dependencies
          run: npm ci
        - name: running test cases
          run: npm run test 